<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
      <button
        id="theme-toggle"
        class="btn-theme-toggle"
        aria-label="Switch to dark mode"
        title="Toggle dark/light mode"
      >🌙</button>
      <section id="balance-section" aria-label="Total Balance">
        <p class="balance-label">Total Spending</p>
        <p id="balance-display">$0.0</p>
      </section>
    </header>

    <main>
      <!-- Add Transaction Form -->
      <section id="form-section" aria-label="Add Transaction">
        <h2>Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="itemName"
              maxlength="100"
              placeholder="e.g. Coffee"
              autocomplete="off"
            />
            <span class="error-msg" id="item-name-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              min="0.01"
              max="9999999.99"
              step="0.01"
              placeholder="e.g. 4.50"
            />
            <span class="error-msg" id="amount-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <div class="category-row">
              <select id="category" name="category">
                <option value="" disabled selected>Select a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Fun">Fun</option>
              </select>
              <button type="button" id="open-add-category" class="btn-add-category" aria-label="Add custom category" title="Add a new category">+ Category</button>
            </div>
            <span class="error-msg" id="category-error" aria-live="polite"></span>
          </div>

          <button type="submit" class="btn-submit" id="save-transaction">Add Transaction</button>
        </form>
      </section>

      <!-- Transaction List -->
      <section id="list-section" aria-label="Transaction List">
       <div class="transactions">
    <div class="card" style="flex:1">
      <h3>Transactions</h3>
      <div id="list"></div>
    </div>
      </section>

      <!-- Spending Chart -->
      <section id="chart-section" aria-label="Spending Distribution">
        <div class="card" style="flex:1">
      <h3>Spending by Category</h3>
      <canvas id="chart"></canvas>
    </div>
      </section>

      <!-- Monthly Summary -->
      <section id="monthly-section" aria-label="Monthly Summary">
        <div class="monthly-header">
          <h2>Monthly Summary</h2>
          <div class="month-nav" role="group" aria-label="Month navigation">
            <button type="button" id="month-prev" class="btn-month-nav" aria-label="Previous month">&#8592;</button>
            <span id="month-label" class="month-label" aria-live="polite" aria-atomic="true"></span>
            <button type="button" id="month-next" class="btn-month-nav" aria-label="Next month">&#8594;</button>
          </div>
        </div>
        <div id="monthly-content">
          <!-- Rendered by JS -->
        </div>
      </section>
    </main>

    <!-- Error Banner (hidden by default, shown on storage errors) -->
    <div id="error-banner" class="error-banner" role="alert" aria-live="assertive" hidden></div>

    <!-- Add Custom Category Dialog -->
    <dialog id="category-dialog" aria-labelledby="dialog-title">
      <form id="category-form" method="dialog" novalidate>
        <h2 id="dialog-title">Add Custom Category</h2>

        <div class="form-group">
          <label for="new-category-name">Category Name</label>
          <input
            type="text"
            id="new-category-name"
            name="categoryName"
            maxlength="30"
            placeholder="e.g. Health"
            autocomplete="off"
          />
          <span class="error-msg" id="new-category-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="new-category-color">Color</label>
          <div class="color-picker-row">
            <input type="color" id="new-category-color" name="categoryColor" value="#a855f7" />
            <span id="color-preview-label" class="color-preview-label">#a855f7</span>
          </div>
        </div>

        <div class="dialog-actions">
          <button type="button" id="cancel-category" class="btn-secondary">Cancel</button>
          <button type="button" id="save-category" class="btn-submit">Save Category</button>
        </div>
      </form>
    </dialog>

    <!-- Chart.js v4 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <!-- Application logic -->
    <script src="js/app.js"></script>
  </body>
</html>
