
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
  <h2>Expense & Budget Visualizer</h2>

  <div class="card">
    <p>Total Balance</p>
    <div class="balance" id="balance">$0</div>
  </div>

  <div class="card">
    <h3>Add Transaction</h3>
    <input type="text" id="name" placeholder="Item Name">
    <input type="number" id="amount" placeholder="Amount">
    <select id="category">
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Fun">Fun</option>
    </select>
    <button onclick="addTransaction()">Add Transaction</button>
  </div>

  <div class="transactions">
    <div class="card" style="flex:1">
      <h3>Transactions</h3>
      <div id="list"></div>
    </div>

    <div class="card" style="flex:1">
      <h3>Spending by Category</h3>
      <canvas id="chart"></canvas>
    </div>
  </div>
</div>

<script>
let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

function save() {
  localStorage.setItem("transactions", JSON.stringify(transactions));
}

function addTransaction() {
  const name = document.getElementById("name").value;
  const amount = parseFloat(document.getElementById("amount").value);
  const category = document.getElementById("category").value;

  if (!name || !amount) return alert("Isi semua field");

  transactions.push({
    id: Date.now(),
    name,
    amount,
    category
  });

  save();
  render();
}

function deleteTransaction(id) {
  transactions = transactions.filter(t => t.id !== id);
  save();
  render();
}

function render() {
  const list = document.getElementById("list");
  const balanceEl = document.getElementById("balance");

  list.innerHTML = "";

  let total = 0;
  let categories = {};

  transactions.forEach(t => {
    total += t.amount;

    if (!categories[t.category]) categories[t.category] = 0;
    categories[t.category] += t.amount;

    list.innerHTML += `
      <div class="transaction-item">
        <div>
          <strong>${t.name}</strong><br>
          $${t.amount} - ${t.category}
        </div>
        <button class="delete-btn" onclick="deleteTransaction(${t.id})">X</button>
      </div>
    `;
  });

  balanceEl.innerText = "$" + total.toFixed(2);

  drawChart(categories);
}

function drawChart(data) {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");

  const colors = {
    Food: "#2ecc71",
    Transport: "#3498db",
    Fun: "#e67e22"
  };

  const total = Object.values(data).reduce((a,b)=>a+b,0);

  let start = 0;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  Object.keys(data).forEach(key => {
    const slice = (data[key] / total) * 2 * Math.PI;

    ctx.beginPath();
    ctx.moveTo(150,150);
    ctx.arc(150,150,100,start,start+slice);
    ctx.closePath();

    ctx.fillStyle = colors[key] || "#ccc";
    ctx.fill();

    start += slice;
  });
}

render();
</script>
    <main>
      <!-- Add Transaction Form -->
      <section id="form-section" aria-label="Add Transaction">
        <h2>Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="itemName"
              maxlength="100"
              placeholder="e.g. Coffee"
              autocomplete="off"
            />
            <span class="error-msg" id="item-name-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              min="0.01"
              max="9999999.99"
              step="0.01"
              placeholder="e.g. 4.50"
            />
            <span class="error-msg" id="amount-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <div class="category-row">
              <select id="category" name="category">
                <option value="" disabled selected>Select a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Fun">Fun</option>
              </select>
              <button type="button" id="open-add-category" class="btn-add-category" aria-label="Add custom category" title="Add a new category">+ Category</button>
            </div>
            <span class="error-msg" id="category-error" aria-live="polite"></span>
          </div>

          <button type="submit" class="btn-submit" id="save-transaction">Add Transaction</button>
        </form>
      </section>

      <!-- Transaction List -->
      <section id="list-section" aria-label="Transaction List">
        <h2>Transactions</h2>
        <div id="transaction-list-container">
          <ul id="transaction-list">
            <li class="empty-state">No transactions recorded yet.</li>
          </ul>
        </div>
      </section>

      <!-- Spending Chart -->
      <section id="chart-section" aria-label="Spending Distribution">
        <h2>Spending by Category</h2>
        <div id="chart-container">
          <canvas id="spending-chart" aria-label="Spending distribution pie chart" role="img"></canvas>
          <p id="chart-placeholder">No spending data available.</p>
        </div>
      </section>

      <!-- Monthly Summary -->
      <section id="monthly-section" aria-label="Monthly Summary">
        <div class="monthly-header">
          <h2>Monthly Summary</h2>
          <div class="month-nav" role="group" aria-label="Month navigation">
            <button type="button" id="month-prev" class="btn-month-nav" aria-label="Previous month">&#8592;</button>
            <span id="month-label" class="month-label" aria-live="polite" aria-atomic="true"></span>
            <button type="button" id="month-next" class="btn-month-nav" aria-label="Next month">&#8594;</button>
          </div>
        </div>
        <div id="monthly-content">
          <!-- Rendered by JS -->
        </div>
      </section>
    </main>

    <!-- Error Banner (hidden by default, shown on storage errors) -->
    <div id="error-banner" class="error-banner" role="alert" aria-live="assertive" hidden></div>

    <!-- Add Custom Category Dialog -->
    <dialog id="category-dialog" aria-labelledby="dialog-title">
      <form id="category-form" method="dialog" novalidate>
        <h2 id="dialog-title">Add Custom Category</h2>

        <div class="form-group">
          <label for="new-category-name">Category Name</label>
          <input
            type="text"
            id="new-category-name"
            name="categoryName"
            maxlength="30"
            placeholder="e.g. Health"
            autocomplete="off"
          />
          <span class="error-msg" id="new-category-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="new-category-color">Color</label>
          <div class="color-picker-row">
            <input type="color" id="new-category-color" name="categoryColor" value="#a855f7" />
            <span id="color-preview-label" class="color-preview-label">#a855f7</span>
          </div>
        </div>

        <div class="dialog-actions">
          <button type="button" id="cancel-category" class="btn-secondary">Cancel</button>
          <button type="button" id="save-category" class="btn-submit">Save Category</button>
        </div>
      </form>
    </dialog>

    <!-- Chart.js v4 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <!-- Application logic -->
    <script src="js/app.js"></script>
  </body>
</html>
