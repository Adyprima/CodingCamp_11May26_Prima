<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense & Budget Visualizer</title>
  <style>
    /* body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    } */

    .container {
      max-width: 900px;
      margin: auto;
    }

    h2 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .spendingChart {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 900px;
      height: 500px;
    }

    .balance {
      text-align: center;
      font-size: 32px;
      color: #3498db;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: #3498db;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #2980b9;
    }

    .transactions {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .delete-btn {
      background: red;
      padding: 5px 10px;
      color: white;
      border: none;
      cursor: pointer;
    }

    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Expense & Budget Visualizer</h2>

  <div class="card">
    <p>Total Balance</p>
    <div class="balance" id="balance">$0</div>
  </div>

  <div class="card">
    <h3>Add Transaction</h3>
    <input type="text" id="name" placeholder="Item Name">
    <input type="number" id="amount" placeholder="Amount">
    <select id="category">
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Fun">Fun</option>
    </select>
    <button onclick="addTransaction()">Add Transaction</button>
  </div>

 
    <div class="card">
      <h3>Transactions</h3>
      <div id="list"></div>
    </div>

    <div class="spendingChart">
      <h3>Spending by Category</h3>
      <canvas id="chart"></canvas>
    </div>
</div>

<script>
let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

function save() {
  localStorage.setItem("transactions", JSON.stringify(transactions));
}

function addTransaction() {
  const name = document.getElementById("name").value;
  const amount = parseFloat(document.getElementById("amount").value);
  const category = document.getElementById("category").value;

  if (!name || !amount) return alert("Isi semua field");

  transactions.push({
    id: Date.now(),
    name,
    amount,
    category
  });

  save();
  render();
}

function deleteTransaction(id) {
  transactions = transactions.filter(t => t.id !== id);
  save();
  render();
}

function render() {
  const list = document.getElementById("list");
  const balanceEl = document.getElementById("balance");

  list.innerHTML = "";

  let total = 0;
  let categories = {};

  transactions.forEach(t => {
    total += t.amount;

    if (!categories[t.category]) categories[t.category] = 0;
    categories[t.category] += t.amount;

    list.innerHTML += `
      <div class="transaction-item">
        <div>
          <strong>${t.name}</strong><br>
          $${t.amount} - ${t.category}
        </div>
        <button class="delete-btn" onclick="deleteTransaction(${t.id})">X</button>
      </div>
    `;
  });

  balanceEl.innerText = "$" + total.toFixed(2);

  drawChart(categories);
}

function drawChart(data) {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");

  const colors = {
    Food: "#2ecc71",
    Transport: "#3498db",
    Fun: "#e67e22"
  };

  const total = Object.values(data).reduce((a,b)=>a+b,0);

  let start = 0;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  Object.keys(data).forEach(key => {
    const slice = (data[key] / total) * 2 * Math.PI;

    ctx.beginPath();
    ctx.moveTo(150,150);
    ctx.arc(150,150,100,start,start+slice);
    ctx.closePath();

    ctx.fillStyle = colors[key] || "#ccc";
    ctx.fill();

    start += slice;
  });
}

render();
</script>

</body>
</html>
