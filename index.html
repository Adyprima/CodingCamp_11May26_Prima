<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
      <section id="balance-section" aria-label="Total Balance">
        <p class="balance-label">Total Spending</p>
        <p id="balance-display">$1.00</p>
      </section>
    </header>

    <main>
      <!-- Add Transaction Form -->
      <section id="form-section" aria-label="Add Transaction">
        <h2>Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="itemName"
              maxlength="100"
              placeholder="e.g. Coffee"
              autocomplete="off"
            />
            <span class="error-msg" id="item-name-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              min="0.01"
              max="9999999.99"
              step="0.01"
              placeholder="e.g. 4.50"
            />
            <span class="error-msg" id="amount-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="" disabled selected>Select a category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="error-msg" id="category-error" aria-live="polite"></span>
          </div>

          <button type="submit" class="btn-submit">Add Transaction</button>
        </form>
      </section>

      <!-- Transaction List -->
      <section id="list-section" aria-label="Transaction List">
        <h2>Transactions</h2>
        <div id="transaction-list-container">
          <ul id="transaction-list">
            <li class="empty-state">No transactions recorded yet.</li>
          </ul>
        </div>
      </section>

      <!-- Spending Chart -->
      <section id="chart-section" aria-label="Spending Distribution">
        <h2>Spending by Category</h2>
        <div id="chart-container">
          <canvas id="spending-chart" aria-label="Spending distribution pie chart" role="img"></canvas>
          <p id="chart-placeholder">No spending data available.</p>
        </div>
      </section>
    </main>

    <!-- Error Banner (hidden by default, shown on storage errors) -->
    <div id="error-banner" class="error-banner" role="alert" aria-live="assertive" hidden></div>

    <!-- Chart.js v4 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <!-- Application logic -->
    <script src="js/app.js"></script>
  </body>
</html>
